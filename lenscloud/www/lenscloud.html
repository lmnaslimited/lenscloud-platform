<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LensCloud Platform</title>
    <meta
      name="description"
      content="LensCloud Platform is the Frappe UI control plane for customer and platform workflows."
    />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }
    </style>
    <link rel="icon" href="/assets/lenscloud/frontend/favicon.ico" />
  <script type="module" crossorigin src="/assets/lenscloud/frontend/assets/lenscloud-CtFKcyLr.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/lenscloud/frontend/assets/style-BnRCz1I0.css">
</head>
  <body>
    <script>
      window.frappe = window.frappe || {};
      window.csrf_token = "{{ csrf_token }}";
      window.frappe.csrf_token = window.csrf_token;
    </script>
    <div id="app"></div>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
